name: Fly Tweets migrate legacy runtime

on:
  push:
    branches:
      - feature/fly-tweets-v1
    paths:
      - .github/workflows/fly-tweets-migrate-legacy-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-tweets-migrate-legacy-runtime
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, windows, x64, flytegral-pc]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Validate, migrate, and remove legacy Fly Tweets runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRows = 11238

          $legacyRoot = Join-Path $env:USERPROFILE 'fly-tweets'
          $legacyCorpus = Join-Path $legacyRoot 'corpus\john-d-cook'
          $legacyJsonl = Join-Path $legacyCorpus 'cook-math-tweets.jsonl'
          $legacyManifest = Join-Path $legacyCorpus 'manifest.json'

          $nativeRoot = Join-Path $env:LOCALAPPDATA 'flytegral\fly-tweets'
          $nativeCorpus = Join-Path $nativeRoot 'corpus\john-d-cook'
          $nativeJsonl = Join-Path $nativeCorpus 'cook-math-tweets.jsonl'
          $nativeManifest = Join-Path $nativeCorpus 'manifest.json'

          function Assert-CorpusPair {
            param(
              [Parameter(Mandatory = $true)][string]$Jsonl,
              [Parameter(Mandatory = $true)][string]$Manifest,
              [Parameter(Mandatory = $true)][string]$Label
            )
            if (-not (Test-Path $Jsonl)) { throw "$Label corpus missing: $Jsonl" }
            if (-not (Test-Path $Manifest)) { throw "$Label manifest missing: $Manifest" }
            $rows = (Get-Content $Jsonl | Measure-Object -Line).Lines
            $meta = Get-Content -Raw $Manifest | ConvertFrom-Json
            if ($rows -ne $expectedRows) {
              throw "$Label corpus row count mismatch: expected=$expectedRows actual=$rows"
            }
            if ([int]$meta.rows -ne $rows) {
              throw "$Label manifest mismatch: manifest=$($meta.rows), actual=$rows"
            }
            $hash = (Get-FileHash -Algorithm SHA256 $Jsonl).Hash
            [pscustomobject]@{ Rows = $rows; Hash = $hash }
          }

          if (Test-Path $legacyRoot) {
            $legacy = Assert-CorpusPair -Jsonl $legacyJsonl -Manifest $legacyManifest -Label 'Legacy'

            New-Item -ItemType Directory -Force -Path $nativeCorpus | Out-Null
            Copy-Item -Force $legacyJsonl $nativeJsonl
            Copy-Item -Force $legacyManifest $nativeManifest

            $native = Assert-CorpusPair -Jsonl $nativeJsonl -Manifest $nativeManifest -Label 'Native'
            if ($legacy.Hash -ne $native.Hash) { throw 'Corpus SHA256 mismatch after migration' }

            Remove-Item -Recurse -Force $legacyRoot
            if (Test-Path $legacyRoot) { throw "Legacy runtime still exists: $legacyRoot" }
            Write-Output 'LEGACY_RUNTIME_REMOVED=true'
          } else {
            $native = Assert-CorpusPair -Jsonl $nativeJsonl -Manifest $nativeManifest -Label 'Native'
            Write-Output 'LEGACY_RUNTIME_ABSENT=true'
            Write-Output 'MIGRATION_ALREADY_COMPLETE=true'
          }

          Write-Output "MIGRATED_ROWS=$($native.Rows)"
          Write-Output "CORPUS_SHA256=$($native.Hash)"
          Write-Output "NATIVE_RUNTIME=$nativeRoot"

      - name: Queue initial Fly Tweets pretraining once
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'sphere-homotopy/flytegral'
          $workflow = 'fly-tweets-initial-pretrain.yml'
          $branch = 'feature/fly-tweets-v1'

          gh auth status --hostname github.com | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI authentication is unavailable for pretrain dispatch.' }

          $runsRaw = gh run list -R $repo --workflow $workflow --branch $branch --limit 20 --json databaseId,status,conclusion,createdAt
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing initial-pretrain runs.' }
          $runs = @($runsRaw | ConvertFrom-Json)
          $active = @($runs | Where-Object { $_.status -ne 'completed' })
          if ($active.Count -gt 0) {
            Write-Output "INITIAL_PRETRAIN_ALREADY_ACTIVE=$($active[0].databaseId)"
            exit 0
          }

          gh workflow run $workflow -R $repo --ref $branch
          if ($LASTEXITCODE -ne 0) { throw 'Failed to dispatch initial Fly Tweets pretraining.' }
          Write-Output 'INITIAL_PRETRAIN_DISPATCHED=true'
