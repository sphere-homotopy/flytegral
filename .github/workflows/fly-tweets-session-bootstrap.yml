name: TEMP Fly Tweets session bootstrap

on:
  push:
    branches:
      - feature/fly-tweets-v1
    paths:
      - .github/workflows/fly-tweets-session-bootstrap.yml

permissions:
  contents: read
  actions: write

jobs:
  verify-and-bootstrap:
    runs-on: [self-hosted, windows, x64, flytegral-pc]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fly-tweets-v1

      - name: Release dedicated interactive X profile
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = 'C:\tools\x-stats\x-browser-profile'
          $escaped = [regex]::Escape($profile)
          $owned = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -in @('chrome.exe','msedge.exe') -and
            $_.CommandLine -and
            $_.CommandLine -match $escaped
          })
          foreach ($process in $owned) {
            Write-Host "CLOSING_X_LOGIN_BROWSER pid=$($process.ProcessId)"
            Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          Write-Host "X_LOGIN_BROWSER_PROCESSES_CLOSED=$($owned.Count)"

      - name: Prepare headless X collector
        working-directory: collector
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --omit=dev --no-audit --no-fund
          npx playwright install chromium
          $empty = Join-Path $env:RUNNER_TEMP 'fly-x-session-empty.jsonl'
          $output = Join-Path $env:RUNNER_TEMP 'fly-x-session-output.jsonl'
          [System.IO.File]::WriteAllText($empty, '', [System.Text.UTF8Encoding]::new($false))
          "FLYTWEETS_X_SMOKE_INPUT=$empty" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FLYTWEETS_X_SMOKE_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify Fly X session headlessly
        working-directory: collector
        env:
          X_PROFILE_DIR: C:\tools\x-stats\x-browser-profile
          X_EXPECTED_HANDLE: fly_topology
        run: |
          $ErrorActionPreference = 'Stop'
          node collect-fly-tweet-stats.js --input $env:FLYTWEETS_X_SMOKE_INPUT --output $env:FLYTWEETS_X_SMOKE_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Fly X session smoke failed.' }
          Write-Host 'X_SESSION_SMOKE_OK=true'
          Write-Host 'X_EXPECTED_HANDLE=@fly_topology'

      - name: Require completed local pretrain checkpoint
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'flytegral\fly-tweets\text-runs'
          $candidate = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              (Test-Path (Join-Path $_.FullName 'checkpoint.pt')) -and
              (Test-Path (Join-Path $_.FullName 'manifest.json'))
            } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'No completed local Fly Tweets pretrain checkpoint exists.' }
          $bytes = (Get-Item (Join-Path $candidate.FullName 'checkpoint.pt')).Length
          if ($bytes -le 0) { throw 'Latest local Fly Tweets checkpoint is empty.' }
          Write-Host "LOCAL_PRETRAIN_READY=true"
          Write-Host "LOCAL_PRETRAIN_RUN=$($candidate.Name)"
          Write-Host "LOCAL_PRETRAIN_CHECKPOINT_BYTES=$bytes"

      - name: Dispatch first daily cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'sphere-homotopy/flytegral'
          $workflow = 'fly-tweets-daily.yml'
          $branch = 'feature/fly-tweets-v1'

          $runsRaw = gh run list -R $repo --workflow $workflow --branch $branch --limit 20 --json databaseId,status,conclusion,createdAt
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing Fly Tweets daily runs.' }
          $runs = @($runsRaw | ConvertFrom-Json)
          $active = @($runs | Where-Object { $_.status -ne 'completed' })
          if ($active.Count -gt 0) {
            Write-Host "DAILY_BOOTSTRAP_ALREADY_ACTIVE=$($active[0].databaseId)"
            exit 0
          }
          $successful = @($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($successful.Count -gt 0) {
            Write-Host "DAILY_BOOTSTRAP_ALREADY_SUCCEEDED=$($successful[0].databaseId)"
            exit 0
          }

          gh workflow run $workflow -R $repo --ref $branch
          if ($LASTEXITCODE -ne 0) { throw 'Failed to dispatch Fly Tweets daily bootstrap.' }
          Write-Host 'DAILY_BOOTSTRAP_DISPATCHED=true'
