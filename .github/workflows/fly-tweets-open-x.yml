name: Fly Tweets open X session

on:
  push:
    branches:
      - feature/fly-tweets-v1
    paths:
      - .github/workflows/fly-tweets-open-x.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-x:
    runs-on: [self-hosted, windows, x64, flytegral-pc]
    timeout-minutes: 3
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Open X in the existing persistent profile
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = 'C:\tools\x-stats\x-browser-profile'
          if (-not (Test-Path $profile)) { throw "Persistent X profile missing: $profile" }

          $candidates = @(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }

          if ($candidates.Count -eq 0) {
            $pwRoot = Join-Path $env:LOCALAPPDATA 'ms-playwright'
            if (Test-Path $pwRoot) {
              $candidate = Get-ChildItem $pwRoot -Filter chrome.exe -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'chromium' } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($candidate) { $candidates = @($candidate.FullName) }
            }
          }
          if ($candidates.Count -eq 0) { throw 'No Chrome/Chromium executable found.' }
          $browser = $candidates[0]

          $consoleUser = (Get-CimInstance Win32_ComputerSystem).UserName
          if (-not $consoleUser) { throw 'No interactive Windows user is logged in.' }

          $service = New-Object -ComObject 'Schedule.Service'
          $service.Connect()
          $root = $service.GetFolder('\\')
          $task = $service.NewTask(0)
          $task.RegistrationInfo.Description = 'One-shot Flytegral X login window'
          $task.Settings.Enabled = $true
          $task.Settings.StartWhenAvailable = $true
          $task.Settings.ExecutionTimeLimit = 'PT30M'
          $task.Principal.UserId = $consoleUser
          $task.Principal.LogonType = 3
          $task.Principal.RunLevel = 0

          $action = $task.Actions.Create(0)
          $action.Path = $browser
          $action.Arguments = "--user-data-dir=`"$profile`" https://x.com/home"

          $taskName = 'Flytegral-X-Login'
          $registered = $root.RegisterTaskDefinition($taskName, $task, 6, $null, $null, 3, $null)
          $null = $registered.Run($null)

          Write-Output "X_LOGIN_WINDOW_REQUESTED=true"
          Write-Output "X_PROFILE=$profile"
          Write-Output "BROWSER=$browser"
          Write-Output "INTERACTIVE_USER=$consoleUser"
