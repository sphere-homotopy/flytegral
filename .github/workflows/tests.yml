name: tests

on:
  push:
    branches:
      - feature/fly-window-v1
      - feature/fly-tweets-v1
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Smoke training CLI
        run: python scripts/train.py --help > /dev/null
      - name: Smoke evaluation CLI
        run: python scripts/evaluate.py --help > /dev/null
      - name: Smoke benchmark CLI
        run: python scripts/benchmark_policy.py --help > /dev/null
