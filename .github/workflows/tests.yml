name: tests

on:
  push:
    branches:
      - feature/fly-window-v1
      - feature/fly-tweets-v1
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Run JavaScript unit tests
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(find collector/tests apps_script/tests -type f -name '*.test.js' 2>/dev/null | sort)
          if [ ${#files[@]} -gt 0 ]; then
            node --test "${files[@]}"
          fi
      - name: Smoke collector scripts
        run: |
          node --check collector/bootstrap-x-session.js
          node --check collector/collect-cook-corpus.js
          node --check collector/metrics-core.js
          node --check collector/collect-fly-tweet-stats.js
          node --check apps_script/FlyTweetsQueue.js
      - name: Smoke training CLI
        run: python scripts/train.py --help > /dev/null
      - name: Smoke text pretraining CLI
        run: python scripts/train_text.py --help > /dev/null
      - name: Smoke tweet generation CLI
        run: python scripts/generate_tweets.py --help > /dev/null
      - name: Smoke evaluation CLI
        run: python scripts/evaluate.py --help > /dev/null
      - name: Smoke benchmark CLI
        run: python scripts/benchmark_policy.py --help > /dev/null

  pc-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/fly-tweets-v1'
    runs-on: [self-hosted, windows, x64, life-supervisor-pc]
    timeout-minutes: 3
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Probe X collector prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "COMPUTER=$env:COMPUTERNAME"
          Write-Output "USER=$env:USERNAME"
          Write-Output "NODE=$((Get-Command node -ErrorAction SilentlyContinue).Source)"
          Write-Output "NPM=$((Get-Command npm -ErrorAction SilentlyContinue).Source)"
          Write-Output "PYTHON=$((Get-Command python -ErrorAction SilentlyContinue).Source)"
          $legacyProfile = 'C:\tools\x-stats\x-browser-profile'
          Write-Output "LEGACY_X_PROFILE_EXISTS=$(Test-Path $legacyProfile)"
          if (Test-Path $legacyProfile) {
            Write-Output "LEGACY_X_PROFILE_ITEMS=$(@(Get-ChildItem -Force $legacyProfile -ErrorAction SilentlyContinue).Count)"
          }
          Write-Output 'FLYTWEETS_PC_RUNNER=true'
