name: Fly Tweets PC runner probe

on:
  push:
    branches:
      - feature/fly-tweets-v1
    paths:
      - .github/workflows/pc-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, windows, x64, flytegral-pc]
    timeout-minutes: 3
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Probe Flytegral runner and X collector prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'GEORGII-flytegral-pc') {
            throw "Unexpected runner: $env:RUNNER_NAME"
          }

          foreach ($command in @('gh', 'py', 'node', 'npm')) {
            $resolved = Get-Command $command -ErrorAction SilentlyContinue
            if (-not $resolved) { throw "Required command missing: $command" }
            Write-Output "$($command.ToUpper())=$($resolved.Source)"
          }

          gh auth status --hostname github.com
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI authentication is not healthy for the Flytegral runner user.' }
          & py -3.12 --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 is unavailable through the Windows py launcher.' }

          $xProfile = 'C:\tools\x-stats\x-browser-profile'
          if (-not (Test-Path $xProfile)) { throw "Persistent X profile missing: $xProfile" }
          $runtimeRoot = Join-Path $env:LOCALAPPDATA 'flytegral\fly-tweets'

          Write-Output "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Output "COMPUTER=$env:COMPUTERNAME"
          Write-Output "USER=$env:USERNAME"
          Write-Output "PWD=$PWD"
          Write-Output "X_PROFILE_EXISTS=true"
          Write-Output "X_PROFILE=$xProfile"
          Write-Output "FLYTEGRAL_RUNTIME=$runtimeRoot"
          Write-Output 'FLYTEGRAL_PC_RUNNER=true'

      - name: Recover native bootstrap chain idempotently
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'sphere-homotopy/flytegral'
          $branch = 'feature/fly-tweets-v1'
          $migrationWorkflow = 'fly-tweets-migrate-legacy-runtime.yml'
          $pretrainWorkflow = 'fly-tweets-initial-pretrain.yml'

          gh auth status --hostname github.com | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI authentication is unavailable for bootstrap recovery.' }

          $migrationRaw = gh run list -R $repo --workflow $migrationWorkflow --branch $branch --limit 20 --json databaseId,status,conclusion,createdAt
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect migration runs.' }
          $migrationRuns = @($migrationRaw | ConvertFrom-Json)
          $migrationActive = @($migrationRuns | Where-Object { $_.status -ne 'completed' })
          if ($migrationActive.Count -gt 0) {
            Write-Output "MIGRATION_ALREADY_ACTIVE=$($migrationActive[0].databaseId)"
            exit 0
          }

          $migrationSuccessful = @($migrationRuns | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($migrationSuccessful.Count -eq 0) {
            gh workflow run $migrationWorkflow -R $repo --ref $branch
            if ($LASTEXITCODE -ne 0) { throw 'Failed to dispatch Fly Tweets runtime migration.' }
            Write-Output 'MIGRATION_DISPATCHED=true'
            exit 0
          }

          Write-Output "MIGRATION_ALREADY_SUCCEEDED=$($migrationSuccessful[0].databaseId)"

          $pretrainRaw = gh run list -R $repo --workflow $pretrainWorkflow --branch $branch --limit 20 --json databaseId,status,conclusion,createdAt
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect initial-pretrain runs.' }
          $pretrainRuns = @($pretrainRaw | ConvertFrom-Json)
          $pretrainActive = @($pretrainRuns | Where-Object { $_.status -ne 'completed' })
          if ($pretrainActive.Count -gt 0) {
            Write-Output "PRETRAIN_ALREADY_ACTIVE=$($pretrainActive[0].databaseId)"
            exit 0
          }

          $pretrainSuccessful = @($pretrainRuns | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($pretrainSuccessful.Count -gt 0) {
            Write-Output "PRETRAIN_ALREADY_SUCCEEDED=$($pretrainSuccessful[0].databaseId)"
            exit 0
          }

          gh workflow run $pretrainWorkflow -R $repo --ref $branch
          if ($LASTEXITCODE -ne 0) { throw 'Failed to recover initial Fly Tweets pretraining.' }
          Write-Output 'PRETRAIN_RECOVERY_DISPATCHED=true'
