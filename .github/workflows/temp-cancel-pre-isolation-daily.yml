name: TEMP Cancel pre-isolation Fly Tweets daily

on:
  push:
    branches:
      - feature/fly-tweets-v1
    paths:
      - .github/workflows/temp-cancel-pre-isolation-daily.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel unsafe daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/sphere-homotopy/flytegral/actions/runs/35285923405/cancel
          echo "CANCEL_REQUESTED=true"
