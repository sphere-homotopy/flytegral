name: MaleCNS data smoke

on:
  push:
    branches:
      - feature/fly-window-v1
    paths:
      - .github/workflows/data-smoke.yml
  workflow_dispatch:

jobs:
  real-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Download pinned MaleCNS v1.0 files
        run: python scripts/fetch_malecns.py --output data/raw
      - name: Build real task subgraph dry run
        run: python scripts/build_subgraph.py --raw-dir data/raw --config configs/subgraph_v1.json --output-dir artifacts/graphs --dry-run | tee data-smoke-summary.json
      - name: Preserve provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-data-smoke
          path: |
            data/raw/source-manifest.json
            data-smoke-summary.json
          if-no-files-found: ignore
