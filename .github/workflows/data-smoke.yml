name: MaleCNS data smoke

on:
  push:
    branches:
      - feature/fly-window-v1
    paths:
      - .github/workflows/data-smoke.yml
  workflow_dispatch:

jobs:
  real-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
      - name: Install project
        run: python -m pip install .
      - name: Download pinned MaleCNS v1.0 files
        run: python scripts/fetch_malecns.py --output data/raw
      - name: Build and export real task subgraph
        run: python scripts/build_subgraph.py --raw-dir data/raw --config configs/subgraph_v1.json --output-dir artifacts/graphs | tee data-smoke-summary.json
      - name: Preserve reusable real graph
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-task-graph-v1
          path: |
            artifacts/graphs/subgraph_v1.npz
            artifacts/graphs/subgraph_v1_nodes.parquet
            artifacts/graphs/subgraph_v1_edges.parquet
            artifacts/graphs/subgraph_v1_manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malecns-data-smoke
          path: |
            data/raw/source-manifest.json
            artifacts/graphs/subgraph_v1_manifest.json
            data-smoke-summary.json
          if-no-files-found: ignore
          retention-days: 30
