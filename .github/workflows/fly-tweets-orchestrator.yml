name: Fly Tweets orchestrator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-tweets-orchestrator.yml
  # Temporarily paused by owner: no automatic Fly Tweets runs.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fly-tweets-orchestrator
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check durable daily marker
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/contents/.github/fly-tweets-last-success.json?ref=feature/fly-tweets-v1"
          if ! payload="$(gh api "$api" 2>/dev/null)"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No durable success marker exists; scheduling Fly daily."
            exit 0
          fi

          marker="$(printf '%s' "$payload" | jq -r '.content' | tr -d '\n' | base64 --decode)"
          completed_at="$(printf '%s' "$marker" | jq -r '.completed_at // empty')"
          if [[ -z "$completed_at" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Success marker has no completed_at; scheduling Fly daily."
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          last_epoch="$(date -u -d "$completed_at" +%s)"
          age_seconds="$(( now_epoch - last_epoch ))"
          min_age_seconds=84600

          if (( age_seconds >= min_age_seconds )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Fly daily is due; last success age is $age_seconds seconds."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Fly daily is not due; last success age is $age_seconds seconds."
          fi

  daily:
    needs: decide
    # Owner pause: prevent manual or push-triggered runs from dispatching the publisher.
    if: false
    runs-on: [self-hosted, windows, x64, flytegral-pc]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fly-tweets-v1

      - name: Prepare persistent runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'flytegral\fly-tweets'
          $state = Join-Path $root 'state'
          $runs = Join-Path $root 'daily-runs'
          $graph = Join-Path $root 'graphs\subgraph_v1'
          $venv = Join-Path $root '.venv'
          New-Item -ItemType Directory -Force -Path $root,$state,$runs,$graph | Out-Null

          $python = Join-Path $venv 'Scripts\python.exe'
          $venvHealthy = $false
          if (Test-Path $python) {
            try {
              $probe = & $python -c 'import sys; print(sys.version_info[:2] == (3, 12))' 2>$null
              $venvHealthy = ($LASTEXITCODE -eq 0) -and (($probe | Out-String).Trim() -eq 'True')
            } catch {
              $venvHealthy = $false
            }
          }
          if (-not $venvHealthy) {
            if (Test-Path $venv) {
              Move-Item $venv "$venv.broken-$(Get-Date -Format 'yyyyMMddTHHmmss')" -ErrorAction Stop
            }
            py -3.12 -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'Could not recreate Fly Tweets Python venv.' }
          }
          # An already healthy editable venv must survive transient DNS outages.
          # Package installs are only required if dependencies have changed.
          $depsStamp = Join-Path $venv '.fly-deps-sha256'
          $depsHash = (Get-FileHash 'pyproject.toml' -Algorithm SHA256).Hash
          $depsCurrent = (Test-Path $depsStamp) -and
            ((Get-Content -Raw $depsStamp).Trim() -eq $depsHash)
          $importsHealthy = $false
          if ($venvHealthy) {
            try {
              $probe = & $python -c 'import torch, fly_window, numpy, pandas, pyarrow, httpx; print(torch.__version__.split("+")[0])' 2>$null
              $importsHealthy = ($LASTEXITCODE -eq 0) -and (-not [string]::IsNullOrWhiteSpace(($probe | Out-String).Trim()))
            } catch { $importsHealthy = $false }
          }
          if ($importsHealthy -and (-not (Test-Path $depsStamp))) {
            # Adopt existing persistent venv installed by the previous workflow.
            $depsHash | Out-File -FilePath $depsStamp -Encoding ascii
            $depsCurrent = $true
          }
          if ($importsHealthy -and $depsCurrent) {
            Write-Output 'FLYTWEETS_VENV_CACHE_HIT=true'
          } else {
            & $python -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) { throw 'Fly pip upgrade failed.' }
            & $python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
            if ($LASTEXITCODE -ne 0) { throw 'Fly PyTorch install failed.' }
            & $python -m pip install -e '.[dev]'
            if ($LASTEXITCODE -ne 0) { throw 'Fly dependency install failed.' }
            $depsHash | Out-File -FilePath $depsStamp -Encoding ascii
          }

          "FLYTEGRAL_RUNTIME=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_STATE_DIR=$state" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_RUN_ROOT=$runs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_GRAPH_DIR=$graph" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure MaleCNS graph artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $npz = Join-Path $env:FLYTWEETS_GRAPH_DIR 'subgraph_v1.npz'
          $nodes = Join-Path $env:FLYTWEETS_GRAPH_DIR 'subgraph_v1_nodes.parquet'
          $manifest = Join-Path $env:FLYTWEETS_GRAPH_DIR 'subgraph_v1_manifest.json'
          if (-not ((Test-Path $npz) -and (Test-Path $nodes) -and (Test-Path $manifest))) {
            Get-ChildItem $env:FLYTWEETS_GRAPH_DIR -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
            gh run download 34867229278 -R sphere-homotopy/flytegral -n malecns-task-graph-v1 -D $env:FLYTWEETS_GRAPH_DIR
          }
          if (-not ((Test-Path $npz) -and (Test-Path $nodes) -and (Test-Path $manifest))) {
            throw 'MaleCNS graph artifact is incomplete.'
          }
          "FLYTWEETS_GRAPH_NPZ=$npz" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_GRAPH_NODES=$nodes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Seed durable model state
        run: |
          $ErrorActionPreference = 'Stop'
          $anchor = Join-Path $env:FLYTWEETS_STATE_DIR 'anchor-checkpoint.pt'
          $current = Join-Path $env:FLYTWEETS_STATE_DIR 'current-checkpoint.pt'
          $cadence = Join-Path $env:FLYTWEETS_STATE_DIR 'cadence-checkpoint.pt'
          $rows = Join-Path $env:FLYTWEETS_STATE_DIR 'rows.json'
          $outbox = Join-Path $env:FLYTWEETS_STATE_DIR 'outbox.jsonl'
          $runtimeState = Join-Path $env:FLYTWEETS_STATE_DIR 'runtime-state.json'
          $result = Join-Path $env:FLYTWEETS_STATE_DIR 'last-cycle-result.json'

          if (-not (Test-Path $anchor)) {
            $pretrainRoot = Join-Path $env:FLYTEGRAL_RUNTIME 'text-runs'
            $candidate = Get-ChildItem $pretrainRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'checkpoint.pt') } |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1
            if ($null -eq $candidate) {
              throw 'No initial Fly Tweets checkpoint exists yet.'
            }
            Copy-Item (Join-Path $candidate.FullName 'checkpoint.pt') $anchor
          }
          if (-not (Test-Path $current)) { Copy-Item $anchor $current }
          if (-not (Test-Path $cadence)) {
            & $env:FLYTWEETS_PYTHON scripts/init_cadence.py `
              --config configs/cadence_v1.json `
              --graph-npz $env:FLYTWEETS_GRAPH_NPZ `
              --nodes-parquet $env:FLYTWEETS_GRAPH_NODES `
              --output $cadence
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          if (-not (Test-Path $rows)) { [System.IO.File]::WriteAllText($rows, "[]`n", $utf8NoBom) }
          if (-not (Test-Path $outbox)) { [System.IO.File]::WriteAllText($outbox, '', $utf8NoBom) }

          "FLYTWEETS_ANCHOR_CHECKPOINT=$anchor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_CURRENT_CHECKPOINT=$current" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_CADENCE_CHECKPOINT=$cadence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_ROWS=$rows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_OUTBOX=$outbox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_RUNTIME_STATE=$runtimeState" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_CYCLE_RESULT=$result" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require Google Sheet transport configuration
        run: |
          $ErrorActionPreference = 'Stop'
          $transport = Join-Path $env:FLYTEGRAL_RUNTIME 'sheet-transport.json'
          if (-not (Test-Path $transport)) {
            throw "Fly Tweets Sheet transport config missing: $transport"
          }
          $config = Get-Content -Raw $transport | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$config.endpoint) -or
              -not ([string]$config.endpoint).StartsWith('https://script.google.com/')) {
            throw 'Fly Tweets Sheet transport endpoint is missing or invalid.'
          }
          "FLYTWEETS_SHEET_TRANSPORT_CONFIG=$transport" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'SHEET_TRANSPORT_CONFIGURED=true'

      - name: Sync previous generated outbox into durable rows
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:FLYTWEETS_PYTHON scripts/sync_fly_tweet_outbox.py `
            --rows-json $env:FLYTWEETS_ROWS `
            --outbox-jsonl $env:FLYTWEETS_OUTBOX

      - name: Flush pending local batches to Google Sheet
        id: flush_previous
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:FLYTWEETS_PYTHON scripts/sync_fly_tweets_sheet.py `
            --action ingest `
            --rows-json $env:FLYTWEETS_ROWS `
            --transport-config $env:FLYTWEETS_SHEET_TRANSPORT_CONFIG

      - name: Sync Google Sheet state before stats
        id: sync_sheet_state
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:FLYTWEETS_PYTHON scripts/sync_fly_tweets_sheet.py `
            --action sync `
            --rows-json $env:FLYTWEETS_ROWS `
            --transport-config $env:FLYTWEETS_SHEET_TRANSPORT_CONFIG

      - name: Prepare metrics targets
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = Join-Path $env:FLYTWEETS_STATE_DIR 'metrics-targets.jsonl'
          # Windows PowerShell 5.1 wraps ConvertFrom-Json arrays inside @(...),
          # which would otherwise write the entire row array as ONE JSONL line.
          # Explicit foreach unrolls the input before per-row serialization.
          $rows = ConvertFrom-Json -InputObject (Get-Content -Raw $env:FLYTWEETS_ROWS)
          $eligible = @(
            foreach ($row in $rows) {
              if (-not [string]::IsNullOrWhiteSpace([string]$row.tweet_url)) {
                $row
              }
            }
          )
          if (@($eligible | Where-Object { $_ -is [Array] }).Count -gt 0) {
            throw 'Metrics targets must contain individual row objects, not nested arrays.'
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          if ($eligible.Count -eq 0) {
            [System.IO.File]::WriteAllText($targets, '', $utf8NoBom)
          } else {
            $lines = @($eligible | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 20 })
            [System.IO.File]::WriteAllLines($targets, $lines, $utf8NoBom)
          }
          "FLYTWEETS_METRICS_TARGETS=$targets" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLYTWEETS_METRICS_TARGET_COUNT=$($eligible.Count)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "METRICS_TARGET_COUNT=$($eligible.Count)"

      - name: Prepare headless X metrics collector
        id: prepare_collector
        continue-on-error: true
        if: env.FLYTWEETS_METRICS_TARGET_COUNT != '0'
        working-directory: collector
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --omit=dev --no-audit --no-fund
          npx playwright install chromium

      - name: Collect X stats headlessly
        id: collect_stats
        if: env.FLYTWEETS_METRICS_TARGET_COUNT != '0' && steps.prepare_collector.outcome == 'success'
        continue-on-error: true
        working-directory: collector
        env:
          X_PROFILE_DIR: C:\tools\x-stats\x-browser-profile
          X_EXPECTED_HANDLE: fly_topology
        run: |
          $ErrorActionPreference = 'Stop'
          $metrics = Join-Path $env:FLYTWEETS_STATE_DIR 'metrics-latest.jsonl'
          # Do not reuse old measurements if the collector fails before writing.
          if (Test-Path $metrics) { Remove-Item -LiteralPath $metrics -Force }
          "FLYTWEETS_METRICS_LATEST=$metrics" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node collect-fly-tweet-stats.js --input $env:FLYTWEETS_METRICS_TARGETS --output $metrics

      - name: Merge fresh metrics when available
        if: steps.collect_stats.outcome == 'success' || steps.collect_stats.outcome == 'failure'
        run: |
          $ErrorActionPreference = 'Stop'
          # Collector can fail after persisting several legitimate observations.
          # Retain that partial snapshot instead of discarding all engagement.
          if ([string]::IsNullOrWhiteSpace($env:FLYTWEETS_METRICS_LATEST) -or
              -not (Test-Path $env:FLYTWEETS_METRICS_LATEST)) {
            Write-Output 'METRICS_PARTIAL_MERGE_SKIPPED_NO_FILE=true'
            exit 0
          }
          & $env:FLYTWEETS_PYTHON scripts/merge_fly_tweet_stats.py `
            --rows-json $env:FLYTWEETS_ROWS `
            --metrics-jsonl $env:FLYTWEETS_METRICS_LATEST
          if ($LASTEXITCODE -ne 0) { throw 'Fly metrics merge failed.' }

      - name: Settle mature observed engagement into durable rewards
        run: |
          $ErrorActionPreference = 'Stop'
          # This must run even when generation is resumed from yesterday's
          # durable outbox; independent training only sees persisted rewards.
          & $env:FLYTWEETS_PYTHON scripts/settle_fly_tweet_rewards.py `
            --rows-json $env:FLYTWEETS_ROWS `
            --reward-config configs/daily_reward_v1.json `
            --runtime-state $env:FLYTWEETS_RUNTIME_STATE
          if ($LASTEXITCODE -ne 0) { throw 'Fly reward settlement failed.' }

      - name: Run cadence-owned daily cycle
        id: run_cycle
        run: |
          $ErrorActionPreference = 'Stop'
          $requestDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $seed = [int]((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))

          # A completed Python cycle persists its outbox and runtime-state before
          # Google Sheet sync or the GitHub success marker. If a later step fails,
          # retry must flush the outbox, NEVER generate another batch with the same
          # daily idempotency keys. Compare both state and saved cycle provenance.
          if ((Test-Path $env:FLYTWEETS_RUNTIME_STATE) -and
              (Test-Path $env:FLYTWEETS_CYCLE_RESULT)) {
            $durable = Get-Content -Raw $env:FLYTWEETS_RUNTIME_STATE | ConvertFrom-Json
            $previous = Get-Content -Raw $env:FLYTWEETS_CYCLE_RESULT | ConvertFrom-Json
            $lastGeneration = [string]$durable.last_generation_at
            $validGeneration = -not [string]::IsNullOrWhiteSpace($lastGeneration)
            if ($validGeneration) {
              $lastAt = [DateTimeOffset]::Parse($lastGeneration)
              $age = [DateTimeOffset]::UtcNow - $lastAt
              # Independent training can advance the deployed checkpoint after
              # this generation was committed. That is NOT a new generation.
              $sameState = ([string]$previous.window_end -eq [string]$durable.queue_horizon_at)
              if ($age.TotalSeconds -ge 0 -and $age.TotalSeconds -lt 84600 -and
                  $sameState) {
                if ([bool]$previous.training_applied -or
                    [bool]$previous.cadence_training_applied) {
                  $source = [string]$previous.checkpoint
                  if (-not (Test-Path $source)) { throw "Recovered checkpoint missing: $source" }
                  $temp = "$env:FLYTWEETS_CURRENT_CHECKPOINT.tmp"
                  Copy-Item -Force $source $temp
                  Move-Item -Force $temp $env:FLYTWEETS_CURRENT_CHECKPOINT
                }
                Write-Output "FLYTWEETS_DAILY_RESUMED=true age_seconds=$([int]$age.TotalSeconds)"
                Write-Output "FLYTWEETS_DAILY_EXIT_CODE=0"
                Get-Content $env:FLYTWEETS_CYCLE_RESULT
                exit 0
              }
            }
          }
          $output = & $env:FLYTWEETS_PYTHON scripts/run_daily_text_training.py `
            --request-date $requestDate `
            --attempt 1 `
            --current-checkpoint $env:FLYTWEETS_CURRENT_CHECKPOINT `
            --anchor-checkpoint $env:FLYTWEETS_ANCHOR_CHECKPOINT `
            --cadence-checkpoint $env:FLYTWEETS_CADENCE_CHECKPOINT `
            --runtime-state $env:FLYTWEETS_RUNTIME_STATE `
            --runtime-config configs/fly_tweets_runtime_v1.json `
            --rows-json $env:FLYTWEETS_ROWS `
            --outbox-jsonl $env:FLYTWEETS_OUTBOX `
            --run-root $env:FLYTWEETS_RUN_ROOT `
            --reward-config configs/daily_reward_v1.json `
            --training-config configs/daily_training_v1.json `
            --graph-npz $env:FLYTWEETS_GRAPH_NPZ `
            --nodes-parquet $env:FLYTWEETS_GRAPH_NODES `
            --base-seed $seed `
            --skip-training `
            --device cpu
          $cycleExit = $LASTEXITCODE
          Write-Output "FLYTWEETS_DAILY_EXIT_CODE=$cycleExit"
          if ($cycleExit -ne 0) { throw "Fly Tweets daily cycle failed with Python exit code $cycleExit." }
          [System.IO.File]::WriteAllLines($env:FLYTWEETS_CYCLE_RESULT, @($output), [System.Text.UTF8Encoding]::new($false))
          $cycle = Get-Content -Raw $env:FLYTWEETS_CYCLE_RESULT | ConvertFrom-Json
          if ([bool]$cycle.training_applied -or [bool]$cycle.cadence_training_applied) {
            $source = [string]$cycle.checkpoint
            if (-not (Test-Path $source)) { throw "Daily checkpoint missing: $source" }
            $temp = "$env:FLYTWEETS_CURRENT_CHECKPOINT.tmp"
            Copy-Item -Force $source $temp
            Move-Item -Force $temp $env:FLYTWEETS_CURRENT_CHECKPOINT
          }
          Get-Content $env:FLYTWEETS_CYCLE_RESULT

      - name: Sync newly generated outbox into durable rows
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:FLYTWEETS_PYTHON scripts/sync_fly_tweet_outbox.py `
            --rows-json $env:FLYTWEETS_ROWS `
            --outbox-jsonl $env:FLYTWEETS_OUTBOX

      - name: Append newly generated batch to Google Sheet
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:FLYTWEETS_PYTHON scripts/sync_fly_tweets_sheet.py `
            --action ingest `
            --rows-json $env:FLYTWEETS_ROWS `
            --transport-config $env:FLYTWEETS_SHEET_TRANSPORT_CONFIG

      - name: Build non-sensitive health heartbeat
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:FLYTWEETS_RUNTIME_STATE)) {
            throw 'Runtime state missing after successful daily cycle.'
          }
          $state = Get-Content -Raw $env:FLYTWEETS_RUNTIME_STATE | ConvertFrom-Json
          $referencePath = Join-Path $env:FLYTWEETS_STATE_DIR 'training-reference-at.txt'
          $lastTraining = [string]$state.last_training_at
          if (-not [string]::IsNullOrWhiteSpace($lastTraining)) {
            $trainingReference = $lastTraining
            [System.IO.File]::WriteAllText($referencePath, $trainingReference, [System.Text.UTF8Encoding]::new($false))
          } elseif (Test-Path $referencePath) {
            $trainingReference = (Get-Content -Raw $referencePath).Trim()
          } else {
            $trainingReference = [DateTimeOffset]::UtcNow.ToString('o')
            [System.IO.File]::WriteAllText($referencePath, $trainingReference, [System.Text.UTF8Encoding]::new($false))
          }

          $heartbeatPath = Join-Path $env:FLYTWEETS_STATE_DIR 'health-heartbeat.json'
          $heartbeat = [ordered]@{
            generated_at = [DateTimeOffset]::UtcNow.ToString('o')
            last_training_at = $state.last_training_at
            training_reference_at = $trainingReference
            queue_horizon_at = $state.queue_horizon_at
            last_stats_at = $state.last_stats_at
            current_checkpoint = $state.current_checkpoint
            github_run_id = $env:GITHUB_RUN_ID
          }
          $json = $heartbeat | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($heartbeatPath, $json, [System.Text.UTF8Encoding]::new($false))
          "FLYTWEETS_HEARTBEAT=$heartbeatPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Content $heartbeatPath

      - name: Upload health heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: fly-tweets-health-heartbeat
          path: ${{ env.FLYTWEETS_HEARTBEAT }}
          if-no-files-found: error
          retention-days: 14

      - name: Record successful autonomous cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -Raw $env:FLYTWEETS_RUNTIME_STATE | ConvertFrom-Json
          $marker = [ordered]@{
            completed_at = [DateTimeOffset]::UtcNow.ToString('o')
            run_id = [long]$env:GITHUB_RUN_ID
            head_sha = (& git rev-parse HEAD).Trim()
            current_checkpoint = [string]$state.current_checkpoint
            queue_horizon_at = [string]$state.queue_horizon_at
          }
          $json = $marker | ConvertTo-Json -Depth 5
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($json + "`n")
          $content = [Convert]::ToBase64String($bytes)
          $api = "repos/$env:GITHUB_REPOSITORY/contents/.github/fly-tweets-last-success.json"
          $current = gh api "${api}?ref=feature/fly-tweets-v1" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Fly Tweets success marker.' }
          # Use gh's JSON field serialization rather than piping JSON via Windows
          # PowerShell: native-command stdin encoding can corrupt the request body.
          gh api --method PUT $api `
            --raw-field "message=ops: record successful Fly Tweets daily $env:GITHUB_RUN_ID" `
            --raw-field "content=$content" `
            --raw-field "branch=feature/fly-tweets-v1" `
            --raw-field "sha=$($current.sha)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not update Fly Tweets success marker.' }

      - name: Train Fly for future cycles (nonblocking)
        id: train_only
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          # Publications and the durable GitHub success marker are committed
          # BEFORE this independent training process. Even a native PyTorch crash
          # cannot invalidate today's delivery or trigger duplicate generation.
          $rows = @(Get-Content -Raw $env:FLYTWEETS_ROWS | ConvertFrom-Json)
          $pending = @($rows | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.training_consumed_at) -and
            (
              -not [string]::IsNullOrWhiteSpace([string]$_.reward) -or
              (-not [string]::IsNullOrWhiteSpace([string]$_.cadence_reward) -and
               -not [string]::IsNullOrWhiteSpace([string]$_.cadence_context))
            )
          })
          if ($pending.Count -eq 0) {
            Write-Output 'FLYTWEETS_TRAINING_SKIPPED_NO_NEW_REWARDS=true'
            exit 0
          }
          $requestDate = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-dd')
          $seed = [int]([DateTimeOffset]::UtcNow.ToString('yyyyMMdd'))
          $trainOutput = & $env:FLYTWEETS_PYTHON scripts/run_daily_text_training.py `
            --request-date $requestDate `
            --attempt $env:GITHUB_RUN_ID `
            --current-checkpoint $env:FLYTWEETS_CURRENT_CHECKPOINT `
            --anchor-checkpoint $env:FLYTWEETS_ANCHOR_CHECKPOINT `
            --cadence-checkpoint $env:FLYTWEETS_CADENCE_CHECKPOINT `
            --runtime-state $env:FLYTWEETS_RUNTIME_STATE `
            --runtime-config configs/fly_tweets_runtime_v1.json `
            --rows-json $env:FLYTWEETS_ROWS `
            --outbox-jsonl $env:FLYTWEETS_OUTBOX `
            --run-root $env:FLYTWEETS_RUN_ROOT `
            --reward-config configs/daily_reward_v1.json `
            --training-config configs/daily_training_v1.json `
            --graph-npz $env:FLYTWEETS_GRAPH_NPZ `
            --nodes-parquet $env:FLYTWEETS_GRAPH_NODES `
            --base-seed $seed `
            --skip-generation `
            --device cpu
          if ($LASTEXITCODE -ne 0) {
            throw "Independent Fly training failed with Python exit code $LASTEXITCODE; generated tweets remain durable."
          }
          $trainResultPath = Join-Path $env:FLYTWEETS_STATE_DIR 'last-training-result.json'
          [System.IO.File]::WriteAllLines($trainResultPath, @($trainOutput), [System.Text.UTF8Encoding]::new($false))
          $trained = Get-Content -Raw $trainResultPath | ConvertFrom-Json
          if ([bool]$trained.training_applied -or [bool]$trained.cadence_training_applied) {
            $source = [string]$trained.checkpoint
            if (-not (Test-Path $source)) { throw "Independent training checkpoint missing: $source" }
            $temp = "$env:FLYTWEETS_CURRENT_CHECKPOINT.tmp"
            Copy-Item -Force $source $temp
            Move-Item -Force $temp $env:FLYTWEETS_CURRENT_CHECKPOINT
          }
          Write-Output "FLYTWEETS_INDEPENDENT_TRAINING_APPLIED=$($trained.training_applied)"
          Get-Content $trainResultPath

      - name: Deliver health alert when required
        if: always()
        env:
          FLYTWEETS_ALERT_TO: ${{ secrets.FLYTWEETS_ALERT_TO }}
          FLYTWEETS_SMTP_SERVER: ${{ secrets.FLYTWEETS_SMTP_SERVER }}
          FLYTWEETS_SMTP_PORT: ${{ secrets.FLYTWEETS_SMTP_PORT }}
          FLYTWEETS_SMTP_USER: ${{ secrets.FLYTWEETS_SMTP_USER }}
          FLYTWEETS_SMTP_PASSWORD: ${{ secrets.FLYTWEETS_SMTP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # A saved last-cycle-result.json may belong to a previous successful run.
          # A failed preparation/sync step MUST NOT report that stale result as health.
          if ('${{ steps.run_cycle.outcome }}' -ne 'success') {
            Write-Output 'HEALTH_ALERT_DELEGATED_TO_HOSTED_WATCHDOG=true'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:FLYTWEETS_CYCLE_RESULT) -or
              -not (Test-Path $env:FLYTWEETS_CYCLE_RESULT)) {
            throw 'Successful daily cycle did not produce an accessible result path.'
          }
          $cycle = Get-Content -Raw $env:FLYTWEETS_CYCLE_RESULT | ConvertFrom-Json
          $alerts = @($cycle.alerts)
          if ($alerts.Count -eq 0) {
            Write-Output 'HEALTH_ALERTS=0'
            exit 0
          }

          $state = Get-Content -Raw $env:FLYTWEETS_RUNTIME_STATE | ConvertFrom-Json
          if ($null -ne $state.last_alert_at -and -not [string]::IsNullOrWhiteSpace([string]$state.last_alert_at)) {
            $lastAlert = [DateTimeOffset]::Parse([string]$state.last_alert_at)
            if ([DateTimeOffset]::UtcNow - $lastAlert -lt [TimeSpan]::FromHours(24)) {
              Write-Output 'HEALTH_ALERT_SUPPRESSED_RECENT=true'
              exit 0
            }
          }

          $required = @(
            $env:FLYTWEETS_ALERT_TO,
            $env:FLYTWEETS_SMTP_SERVER,
            $env:FLYTWEETS_SMTP_PORT,
            $env:FLYTWEETS_SMTP_USER,
            $env:FLYTWEETS_SMTP_PASSWORD
          )
          if (@($required | Where-Object { [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) {
            $alerts | ConvertTo-Json -Depth 10 | Write-Output
            Write-Output 'HEALTH_ALERT_DELEGATED_TO_HOSTED_WATCHDOG=true'
            exit 0
          }

          $subject = '[Fly Tweets] health alert'
          $body = ($alerts | ForEach-Object { "[$($_.code)] $($_.message)" }) -join "`r`n"
          $body += "`r`n`r`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $message = [System.Net.Mail.MailMessage]::new()
          $message.From = [System.Net.Mail.MailAddress]::new($env:FLYTWEETS_SMTP_USER)
          $message.To.Add($env:FLYTWEETS_ALERT_TO)
          $message.Subject = $subject
          $message.Body = $body
          $smtp = [System.Net.Mail.SmtpClient]::new($env:FLYTWEETS_SMTP_SERVER, [int]$env:FLYTWEETS_SMTP_PORT)
          $smtp.EnableSsl = $true
          $smtp.Credentials = [System.Net.NetworkCredential]::new(
            $env:FLYTWEETS_SMTP_USER,
            $env:FLYTWEETS_SMTP_PASSWORD
          )
          try {
            $smtp.Send($message)
          } finally {
            $smtp.Dispose()
            $message.Dispose()
          }

          $state.last_alert_at = [DateTimeOffset]::UtcNow.ToString('o')
          $stateJson = $state | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($env:FLYTWEETS_RUNTIME_STATE, $stateJson, [System.Text.UTF8Encoding]::new($false))
          Write-Output "HEALTH_ALERT_SENT=$($alerts.Count)"
